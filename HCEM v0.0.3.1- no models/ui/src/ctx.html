<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>HCEM 菜单 b2311</title>
<style>
  * { box-sizing: border-box; }
  html { height: 100%; }
  /* body 不要吃满高度：否则 #ctx 会被 flex 拉伸成窗口高度，
     量出来的就永远是窗口高度，底部那截空白怎么都缩不掉。 */
  html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; }
  body { display: flex; align-items: flex-start; justify-content: stretch; font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }

  #ctx {
    display: flex; flex-direction: column; width: 100%; height: auto;
    align-self: flex-start;
    background: rgba(13, 17, 23, .97);
    border: 1px solid rgba(255, 255, 255, .10);
    border-radius: 12px; padding: 6px;
    box-shadow: 0 18px 44px rgba(0, 0, 0, .6);
  }
  #ctx button {
    flex: 0 0 auto; height: 43px; display: flex; align-items: center; gap: 10px;
    padding: 0 10px; border: none; background: transparent;
    color: #fff; font: inherit; font-size: 13.5px; cursor: pointer;
    border-radius: 8px; text-align: left; white-space: nowrap;
  }
  #ctx button:hover { background: #21262c; }
  #ctx button svg { width: 16px; height: 16px; flex-shrink: 0; fill: currentColor; }
  #ctx .sep { height: 1px; background: rgba(255, 255, 255, .08); margin: 5px 6px; }
</style>
</head>
<body>
  <div id="ctx">
    <button data-page="persona"><svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-5 0-9 2.5-9 5.5V22h18v-2.5c0-3-4-5.5-9-5.5Z"/></svg>角色卡</button>
    <button data-page="import"><svg viewBox="0 0 24 24"><path d="M11 3h2v10.6l3.3-3.3 1.4 1.4L12 18l-5.7-5.7 1.4-1.4 3.3 3.3V3ZM4 19h16v2H4v-2Z"/></svg>记忆导入</button>
    <button data-page="hsl"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 2 2 0 0 0 2-2c0-.5-.2-1-.5-1.4-.3-.4-.5-.8-.5-1.3 0-1 .8-1.8 1.8-1.8H17a5 5 0 0 0 5-5C22 6.1 17.5 2 12 2Z"/></svg>HSL引擎</button>
    <button data-page="multi"><svg viewBox="0 0 24 24"><path d="M12 2 2 8l10 6 10-6-10-6Zm0 8.5L5 6.5 12 4l7 2.5-7 2.5ZM2 12l10 6 10-6-2-1.2-8 4.8-8-4.8L2 12Z"/></svg>多模态</button>
    <button data-page="settings"><svg viewBox="0 0 24 24"><path d="M19.14 12.94a7.07 7.07 0 0 0 .06-.94 7.07 7.07 0 0 0-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.02 7.02 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.58.24-1.12.55-1.62.94l-2.39-.96a.5.5 0 0 0-.61.22L2.74 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.62-.06.94s.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.23.4.32.61.22l2.39-.96c.5.39 1.04.7 1.62.94l.36 2.54c.04.24.25.42.5.42h3.84c.25 0 .46-.18.5-.42l.36-2.54c.58-.24 1.12-.55 1.62-.94l2.39.96c.21.1.48.01.61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2Z"/></svg>设置</button>
    <div class="sep"></div>
    <button data-page="__quit"><svg viewBox="0 0 24 24"><path d="M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h5v-2H5V5h5V3Zm5.6 5.4L14.2 9.8 16.4 12H9v2h7.4l-2.2 2.2 1.4 1.4L21 12l-5.4-5.6Z"/></svg>退出</button>
  </div>
  <script>
    // 禁止 WebView2 默认右键菜单（悬浮球右键菜单是自绘的）
    document.addEventListener('contextmenu', (e) => { e.preventDefault() }, true)
    const invoke = (cmd, args) => {
      const t = window.__TAURI__
      return t?.core?.invoke ? t.core.invoke(cmd, args) : Promise.reject(new Error('no tauri'))
    }
    document.querySelectorAll('#ctx button').forEach((b) => {
      b.onclick = async () => {
        const page = b.dataset.page
        try {
          if (page === '__quit') await invoke('quit_app')
          else await invoke('open_menu', { page })
        } catch (e) {}
        try { await invoke('close_ctx') } catch (e) {}
      }
    })
    // 点击空白处关闭
    document.addEventListener('mousedown', (e) => {
      if (!e.target.closest('#ctx button')) invoke('close_ctx').catch(() => {})
    })
    // 窗口高度跟随内容：菜单项变了（比如去掉某项）也不会在底部多出一截空白。
    // 面板自身 height:auto，所以这里量到的是真实内容高度；resize_ctx 用的是逻辑像素。
    const fitToContent = async () => {
      try {
        const el = document.getElementById('ctx')
        const r = el.getBoundingClientRect()
        // 宽度不许被内容撑开（按用户设定的窄宽度固定），只自动贴合高度
        await invoke('resize_ctx', { width: 120, height: Math.ceil(r.height) })
      } catch (e) {}
    }
    window.addEventListener('load', fitToContent)
    // 每次弹出来都会 set_focus，借这个时机再对一次（字体加载完高度会变）
    window.addEventListener('focus', fitToContent)

    // 失焦关闭
    window.addEventListener('blur', () => { invoke('close_ctx').catch(() => {}) })
  </script>
</body>
</html>
