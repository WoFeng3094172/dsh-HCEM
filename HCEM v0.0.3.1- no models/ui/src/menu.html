<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>HCEM 主菜单 b2311</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: linear-gradient(145deg, #25272e, #15171d);
    --fg: #e6e8ee;
    --dim: #8b949e;
    --cyan: #39d0d8;
    --blue: #2f81f7;
    --green: #22c55e;
    --line: rgba(255, 255, 255, 0.07);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  body { font: 13px/1.5 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif; color: var(--fg); }

  #app {
    width: 100%; height: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 14px;
    display: flex; flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  /* ============ 顶部选项卡 ============ */
  header {
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: 16px 22px 18px; flex: 0 0 auto;
    -webkit-app-region: drag;
  }
  .tabs { display: flex; gap: 22px; }
  .tab {
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    background: none; border: none; color: var(--fg); cursor: pointer;
    font: inherit; font-size: 12px; padding: 0; position: relative;
    -webkit-app-region: no-drag;
  }
  .tab .ic {
    width: 46px; height: 46px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s, transform .2s;
  }
  .tab:hover .ic { background: rgba(255, 255, 255, 0.06); }
  .tab.active .ic { background: rgba(255, 255, 255, 0.09); transform: translateY(-1px); }
  .tab.active::after {
    content: ""; position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%);
    width: 18px; height: 3px; border-radius: 2px; background: var(--blue);
  }
  .tab svg { width: 21px; height: 21px; }

  /* ---------- 返回按钮（Uiverse by KINGFRESS：蓝点扩散）---------- */
  #back {
    font-family: Arial, Helvetica, sans-serif;
    font-weight: bold; color: white;
    background-color: #171717;
    padding: 0.9em 1.6em;
    border: none; border-radius: .6rem;
    position: relative; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    line-height: 1; overflow: hidden; contain: paint; isolation: isolate;
    font-size: 13px; -webkit-app-region: no-drag;
  }
  #back span:not(.txt) {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    height: 30px; width: 30px; background-color: #0c66ed;
    border-radius: 50%; transition: .6s ease;
    z-index: 0; pointer-events: none;
  }
  #back span:nth-of-type(1) { transform: translate(-3.3em, -4em); }
  #back span:nth-of-type(2) { transform: translate(-6em, 1.3em); }
  #back span:nth-of-type(3) { transform: translate(-.2em, 1.8em); }
  #back span:nth-of-type(4) { transform: translate(3.5em, 1.4em); }
  #back span:nth-of-type(5) { transform: translate(3.5em, -3.8em); }
  #back:hover span:not(.txt) { transform: translate(-50%, -50%) scale(4); transition: 1.5s ease; }
  #back .txt {
    position: relative; display: inline-flex; align-items: center; justify-content: center;
    gap: 6px; z-index: 2; line-height: 1; white-space: nowrap;
  }
  #back .txt svg { display: block; width: 15px; height: 15px; flex-shrink: 0; }

  main { flex: 1; overflow-y: auto; padding: 26px 22px 24px; }
  main::-webkit-scrollbar { width: 8px; }
  main::-webkit-scrollbar-thumb { background: rgba(255,255,255,.08); border-radius: 4px; }
  /* 文本域滚动条：跟 UI 深色配色统一（原来默认白色，很扎眼） */
  textarea::-webkit-scrollbar { width: 10px; }
  textarea::-webkit-scrollbar-track { background: #15181d; border-radius: 6px; }
  textarea::-webkit-scrollbar-thumb {
    background: #2f3742; border-radius: 6px; border: 2px solid #15181d;
  }
  textarea::-webkit-scrollbar-thumb:hover { background: #3d4756; }
  textarea { scrollbar-color: #2f3742 #15181d; scrollbar-width: thin; }
  .page { display: none; }
  .page.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* ============ 通用面板 ============ */
  .panel {
    background:
      radial-gradient(circle at 50% 0%, rgba(255,255,255,.06), transparent 42%),
      var(--panel);
    border-radius: 22px;
    box-shadow: 0 18px 40px rgba(0,0,0,.4), inset 0 1px 1px rgba(255,255,255,.1);
    padding: 18px 20px 20px;
  }
  .panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .panel-head h2 { margin: 0; font-size: 16px; font-weight: 900; letter-spacing: .04em; }
  .panel-head .sub { font-size: 12px; color: var(--dim); }

  /* ---------- 保存按钮（Uiverse：5 点扩散）---------- */
  .plain-btn { font: inherit; color: #c9d1d9; background: #24263a; border: none; border-radius: 8px; padding: 8px 18px; cursor: pointer; font-weight: 700; }
  .plain-btn:hover { background: #2d3047; }
  .save-btn {
    --dot-color: #0c66ed;
    font-family: Arial, Helvetica, sans-serif;
    font-weight: bold; color: white;
    background-color: #24263a;
    padding: 0.65em 1em; min-width: 88px;
    border: none; border-radius: 0.5rem;
    position: relative; cursor: pointer; font-size: 14px;
    display: inline-flex; align-items: center; justify-content: center;
    line-height: 1; overflow: hidden; contain: paint; isolation: isolate;
    transition: background-color .25s ease, transform .1s ease; outline: none;
  }
  .save-btn:hover:not(.saved) { background-color: #2d3047; }
  .save-btn:active:not(.saved) { transform: scale(.96); }
  .save-btn span:not(:nth-child(6)) {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    height: 30px; width: 30px; background-color: var(--dot-color);
    border-radius: 50%; transition: .6s ease, background-color .25s ease;
    z-index: 0; pointer-events: none;
  }
  .save-btn span:nth-child(1) { transform: translate(-3.3em, -4em); }
  .save-btn span:nth-child(2) { transform: translate(-6em, 1.3em); }
  .save-btn span:nth-child(3) { transform: translate(-.2em, 1.8em); }
  .save-btn span:nth-child(4) { transform: translate(3.5em, 1.4em); }
  .save-btn span:nth-child(5) { transform: translate(3.5em, -3.8em); }
  .save-btn span:nth-child(6) {
    position: relative; display: inline-flex; align-items: center; justify-content: center;
    gap: 6px; z-index: 2; line-height: 1; white-space: nowrap;
  }
  .save-btn:hover:not(.saved) span:not(:nth-child(6)) {
    transform: translate(-50%, -50%) scale(4); transition: 1.5s ease;
  }
  .save-btn.saved { --dot-color: #10b981; background-color: #064e3b; color: #a7f3d0; pointer-events: none; }
  .save-btn.saved span:not(:nth-child(6)) { transform: translate(-50%, -50%) scale(4); transition: .4s ease; }

  /* ============ 角色卡页 ============ */
  .persona-panel textarea {
    width: 100%; height: 236px; background: #101114;
    border: 1px solid rgba(255,255,255,.08); border-radius: 14px;
    color: #e0e0e0; font: inherit; font-size: 14px; line-height: 1.65;
    padding: 16px 16px 38px; resize: none; outline: none; display: block;
    transition: border-color .25s, box-shadow .25s;
  }
  .persona-panel textarea:focus {
    border-color: rgba(12,102,237,.6); box-shadow: 0 0 0 3px rgba(12,102,237,.12);
  }
  .persona-panel .wrap { position: relative; }
  .persona-panel .count {
    position: absolute; right: 16px; bottom: 12px;
    font-size: 12px; font-weight: 600; color: rgba(255,255,255,.35);
    font-variant-numeric: tabular-nums; pointer-events: none;
  }
  .persona-bottom { display: grid; grid-template-columns: 1fr 180px; gap: 16px; margin-top: 16px; align-items: stretch; }

  /* 性格滑块 */
  .slider-hint { font-size: 11.5px; color: #6b7280; margin: 0 0 8px 2px; }
  .slider-group {
    --c: hsl(194 100% 55%);
    --thumb: 18px;
    display: grid;
    grid-template-columns: 3.2em 1fr 3.2em;
    grid-template-rows: auto auto auto;
    column-gap: 12px; align-items: center;
    margin-bottom: 10px;
  }
  .side-label { font-size: 15px; font-weight: 600; color: rgba(220,235,250,.72); white-space: nowrap; }
  .side-label.left { grid-column: 1; grid-row: 1; text-align: right; }
  .side-label.right { grid-column: 3; grid-row: 1; text-align: left; }
  .slider-wrap { grid-column: 2; grid-row: 1; position: relative; height: 26px; transform: scaleX(-1); }
  .slider-wrap input[type=range] {
    position: absolute; inset: 0; width: 100%; height: 26px; margin: 0;
    background: transparent; -webkit-appearance: none; appearance: none; cursor: pointer; outline: none;
  }
  .slider-wrap input[type=range]::-webkit-slider-runnable-track {
    height: 7px; border-radius: 999px; background: var(--c);
    box-shadow: inset 0 1px 3px rgba(0,0,0,.35), 0 0 8px color-mix(in srgb, var(--c) 28%, transparent);
  }
  .slider-wrap input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: var(--thumb); height: var(--thumb);
    margin-top: calc((7px - var(--thumb)) / 2); border-radius: 50%;
    border: 1px solid rgba(255,255,255,.65);
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.9), transparent 45%), var(--c);
    box-shadow: 0 0 7px color-mix(in srgb, var(--c) 45%, transparent), 0 4px 8px rgba(0,0,0,.55);
  }
  .ticks { grid-column: 2; grid-row: 2; position: relative; height: 4px; margin: -2px 9px 0; pointer-events: none; transform: scaleX(-1); }
  .tick { position: absolute; top: 0; width: 1px; height: 2px; background: rgba(200,235,255,.2); transform: translateX(-50%); }
  .tick.major { height: 4px; background: rgba(200,235,255,.45); }
  .slider-val {
    grid-column: 2; grid-row: 3; text-align: center; font-size: 15px; font-weight: 900;
    color: var(--c); font-variant-numeric: tabular-nums; margin-top: 2px;
    text-shadow: 0 0 6px color-mix(in srgb, var(--c) 40%, transparent);
  }

  /* 搭话度 */
  .talk-panel { padding: 16px 14px; }
  .persona-bottom > .panel { min-height: 180px; display: flex; flex-direction: column; justify-content: center; }
  .persona-bottom > .panel:not(.talk-panel) { padding-top: 40px; }
  .talk-panel .panel-head { margin-bottom: 6px; }
  .talk-panel .panel-head h2 { font-size: 14px; }
  .radio-container { --total-radio: 3; --c1: #ff6b3d; --c2: #ffb03d; --c3: #3da5ff; position: relative; padding-left: 2px; }
  .radio-container input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .radio-container input:nth-of-type(1) { --c: var(--c1); }
  .radio-container input:nth-of-type(2) { --c: var(--c2); }
  .radio-container input:nth-of-type(3) { --c: var(--c3); }
  .radio-container .glider-container {
    position: absolute; left: 0; top: 0; bottom: 0; width: 2px; border-radius: 2px;
    background: linear-gradient(0deg, rgba(0,0,0,0), rgba(255,255,255,.08) 50%, rgba(0,0,0,0));
    pointer-events: none; z-index: 0;
  }
  .radio-container .glider {
    position: relative; height: calc(100% / var(--total-radio)); width: 100%; border-radius: 2px;
    --active-c: var(--c1);
    background: linear-gradient(0deg, rgba(0,0,0,0) 0%, var(--active-c) 50%, rgba(0,0,0,0) 100%);
    transition: transform .5s cubic-bezier(.37,1.95,.66,.56), background .35s ease;
  }
  .radio-container .glider::before {
    content: ""; position: absolute; height: 90%; width: 420%; top: 50%; left: 50%;
    transform: translate(-50%, -50%); background: var(--active-c);
    filter: blur(16px); opacity: .9; transition: background .35s ease;
  }
  /* 长方条光：覆盖选中选项，灯（左）最亮 → 向右渐变透明 */
  .radio-container .glider::after {
    content: ""; position: absolute; inset: -4px 0; height: calc(100% + 8px);
    left: 0; right: 0;
    background: linear-gradient(90deg, var(--active-c) 0%, color-mix(in srgb, var(--active-c) 45%, transparent) 45%, transparent 100%);
    opacity: .55; border-radius: 6px; pointer-events: none;
    transition: background .35s ease;
  }
  .radio-container label {
    cursor: pointer; padding: 24px 8px 24px 16px; position: relative; z-index: 1;
    color: rgba(200,210,225,.55); font-size: 21px; font-weight: 700; letter-spacing: .06em;
    border-radius: 10px; display: flex; align-items: center; gap: 8px;
    transition: color .3s, background-color .3s, text-shadow .3s;
  }
  .radio-container label:hover { color: rgba(230,238,248,.85); background: rgba(255,255,255,.03); }
  .radio-container input:checked + label {
    color: var(--c);
    background: linear-gradient(90deg, color-mix(in srgb, var(--c) 22%, transparent) 0%, color-mix(in srgb, var(--c) 6%, transparent) 55%, transparent 100%);
    text-shadow: 0 0 12px color-mix(in srgb, var(--c) 45%, transparent);
    box-shadow: inset 0 0 18px color-mix(in srgb, var(--c) 22%, transparent);
  }
  .radio-container input:nth-of-type(1):checked ~ .glider-container .glider { transform: translateY(0); --active-c: var(--c1); }
  .radio-container input:nth-of-type(2):checked ~ .glider-container .glider { transform: translateY(100%); --active-c: var(--c2); }
  .radio-container input:nth-of-type(3):checked ~ .glider-container .glider { transform: translateY(200%); --active-c: var(--c3); }

  /* ============ 多模态页 ============ */
  #hcem-toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); background: rgba(220,38,38,.95); color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 14px; font-weight: 700; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 99; }
  #hcem-toast.show { opacity: 1; transform: translate(-50%, 0); }
  .multi-panel { position: relative; }
  #hcem-toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); background: rgba(220,38,38,.95); color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 14px; font-weight: 700; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 99; }
  #hcem-toast.show { opacity: 1; transform: translate(-50%, 0); }
  .multi-panel { position: relative; }
  .multi-wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 0; }
  .multi-panel .mod-row, .multi-panel .check-row { position: relative; z-index: 1; }
  .multi-wires .wire-bg { fill: none; stroke: rgba(255,255,255,.10); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  .multi-wires .wire-flow {
    fill: none; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round;
    filter: drop-shadow(0 0 7px currentColor);
  }
  .multi-wires .wire-dot { fill: none; stroke: rgba(255,255,255,.45); stroke-width: 2; }
  @keyframes wireflow { 0% { stroke-dashoffset: 1000; } 100% { stroke-dashoffset: 0; } }
  .check-row .check-text { display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .check-row .check-state { font-size: 22px; font-weight: 900; color: var(--green); }
  .mod-row { display: flex; align-items: center; gap: 14px; padding: 14px 0; position: relative; }
  .mod-row > .btn-start { flex: 0 0 auto; }
  .mod-row .name { font-size: 17px; font-weight: 900; letter-spacing: .02em; white-space: nowrap; }
  .line-slot { flex: 1; min-width: 0; }
  /* .line-slot 已用 flex:1 撑开，按钮不需要 margin-left:auto（会导致按钮被推出面板被裁） */
  /* ---------- 音量（音量.txt 原版：喇叭 + 白色进度 + 静音×）---------- */
  .vol-row { display: flex; align-items: center; gap: 10px; width: 300px; flex: 0 0 auto; }
  .vol-row .vol-icon {
    flex: 0 0 auto; width: 22px; height: 22px; display: flex;
    align-items: center; justify-content: center;
    color: rgb(150,150,150); cursor: pointer; transition: color .2s;
  }
  .vol-row .vol-icon svg { width: 100%; height: 100%; fill: currentColor; }
  .vol-row .vol-icon:hover, .vol-row.is-muted .vol-icon { color: #fff; }
  .vol-row .vol-icon .wave { opacity: 1; transition: opacity .2s; }
  .vol-row .vol-icon .mute { opacity: 0; transition: opacity .2s; }
  .vol-row.is-muted .vol-icon .wave { opacity: 0; }
  .vol-row.is-muted .vol-icon .mute { opacity: 1; }
  .vol-row .vol-level { flex: 1; height: 6px; accent-color: var(--blue); cursor: pointer; outline: none; }
  .vol-row .vol-value {
    flex: 0 0 auto; min-width: 2.4em; text-align: right; position: relative; z-index: 2; background: var(--panel-bg, #15171d); padding: 2px 6px; border-radius: 6px;
    font-variant-numeric: tabular-nums; font-weight: 700; font-size: 15px; color: #c9d1d9;
  }

  /* ---------- 记忆导入：预打戳加载 ---------- */
  .imp-stage { display: none; align-items: center; gap: 16px; margin-top: 14px; padding: 14px 16px; background: rgba(47,129,247,.06); border: 1px solid rgba(47,129,247,.25); border-radius: 12px; }
  .imp-stage.show { display: flex; }
  .imp-cube { position: relative; width: 34px; height: 34px; flex: 0 0 auto; transform-style: preserve-3d; animation: imp-spin 2.4s linear infinite; }
  .imp-cube span { position: absolute; inset: 0; background: #2f81f7; opacity: .85; border-radius: 4px; }
  .imp-cube span:nth-child(1) { transform: translateZ(17px); }
  .imp-cube span:nth-child(2) { transform: rotateY(90deg) translateZ(17px); background: #3b8ef8; }
  .imp-cube span:nth-child(3) { transform: rotateY(180deg) translateZ(17px); background: #1f6fe0; }
  .imp-cube span:nth-child(4) { transform: rotateY(-90deg) translateZ(17px); background: #4f9bff; }
  @keyframes imp-spin { from { transform: rotateX(-18deg) rotateY(0deg); } to { transform: rotateX(-18deg) rotateY(360deg); } }
  .imp-text { flex: 1; font-size: 13px; color: #cfe0ff; }
  .imp-bar { flex: 0 0 220px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; }
  .imp-bar i { display: block; height: 100%; width: 0%; border-radius: 3px; background: linear-gradient(90deg, #2f81f7, #4f9bff); transition: width .25s ease; }
}
}
}
}
  /* ---------- 检测结果卡片 ---------- */
  .check-card { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.98); width: 420px; max-height: 84vh; overflow: auto; background: #101319; border: 1px solid rgba(255,255,255,.12); border-radius: 14px; padding: 16px 18px; box-shadow: 0 26px 60px rgba(0,0,0,.6); z-index: 30; display: none; }
  .check-card.show { display: block; }
  .check-card h3 { margin: 0 0 10px; font-size: 15px; }
  .check-card .row2 { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,.06); font-size: 12.5px; }
  .check-card .row2:last-of-type { border-bottom: none; }
  .check-card .mark { width: 18px; height: 18px; flex: 0 0 auto; }
  .check-card .nm { flex: 1; }
  .check-card .dt { color: #8b93a1; font-size: 11.5px; }
  .check-card .actions { display: flex; justify-content: flex-end; margin-top: 12px; }
  /* ---------- 启动按钮（Uiverse by augustin_4687：星星 + 三环）---------- */
  .btn-start {
    --stone-50: #fafaf9;
    --stone-800: #292524;
    --yellow-400: #facc15;
    --grad-start: #311FEF;
    --grad-end: #06E085;
    --accent-mid: #1C80BA;
    flex-shrink: 0;
    font-family: "Rubik", "Segoe UI", sans-serif;
    cursor: pointer; position: relative;
    display: inline-flex; align-items: center; justify-content: center;
    font-weight: bold; line-height: 1; font-size: 13px;
    border-radius: 1rem; outline: 2px solid transparent; outline-offset: 6px;
    color: var(--stone-50); background: transparent; border: none;
    padding: 0;
  }
  .btn-start:active { outline-color: var(--yellow-400); }
  .btn-start:focus-visible { outline-color: var(--yellow-400); outline-style: dashed; }
  .btn-start::before {
    content: ""; position: absolute; z-index: 0;
    height: 200%; max-height: 88px; aspect-ratio: 1; margin: auto;
    background: var(--yellow-400);
    clip-path: polygon(100% 50%, 91.48% 56.57%, 97.55% 65.45%, 87.42% 69.07%, 90.45% 79.39%, 79.7% 79.7%, 79.39% 90.45%, 69.07% 87.42%, 65.45% 97.55%, 56.57% 91.48%, 50% 100%, 43.43% 91.48%, 34.55% 97.55%, 30.93% 87.42%, 20.61% 90.45%, 20.3% 79.7%, 9.55% 79.39%, 12.58% 69.07%, 2.45% 65.45%, 8.52% 56.57%, 0% 50%, 8.52% 43.43%, 2.45% 34.55%, 12.58% 30.93%, 9.55% 20.61%, 20.3% 20.3%, 20.61% 9.55%, 30.93% 12.58%, 34.55% 2.45%, 43.43% 8.52%, 50% 0%, 56.57% 8.52%, 65.45% 2.45%, 69.07% 12.58%, 79.39% 9.55%, 79.7% 20.3%, 90.45% 20.61%, 87.42% 30.93%, 97.55% 34.55%, 91.48% 43.43%);
    animation: star-rotate 4s linear infinite;
    animation-play-state: paused;
    opacity: 0.1; transition: opacity 150ms ease;
  }
  .btn-start:hover::before { opacity: 1; }
  .btn-start.is-active::before { animation-play-state: running; opacity: .5; }
  .btn-start.is-active:hover::before { opacity: 1; }
  .btn-start > div {
    padding: 2px; border-radius: 0.75rem;
    background: linear-gradient(135deg, var(--grad-start), var(--grad-end));

<script>
const api = window.hcem || null
const TABS = [
  { id: 'persona', name: '角色卡', icon: 'M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-5 0-9 2.5-9 5.5V22h18v-2.5c0-3-4-5.5-9-5.5Z' },
  { id: 'import', name: '记忆导入', icon: 'M11 3h2v10.6l3.3-3.3 1.4 1.4L12 18l-5.7-5.7 1.4-1.4 3.3 3.3V3ZM4 19h16v2H4v-2Z' },
  { id: 'hsl', name: 'HSL引擎', icon: 'M12 2a10 10 0 1 0 0 20 2 2 0 0 0 2-2c0-.5-.2-1-.5-1.4-.3-.4-.5-.8-.5-1.3 0-1 .8-1.8 1.8-1.8H17a5 5 0 0 0 5-5C22 6.1 17.5 2 12 2Z' },
  { id: 'multi', name: '多模态', icon: 'M12 2 2 8l10 6 10-6-10-6Zm0 8.5L5 6.5 12 4l7 2.5-7 2.5ZM2 12l10 6 10-6-2-1.2-8 4.8-8-4.8L2 12Z' },
  { id: 'settings', name: '设置', icon: 'M19.14 12.94a7.07 7.07 0 0 0 0-1.88l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.5.5 0 0 0-.61.22L2.74 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.07 7.07 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.42.32.61.22l2.39-.96c.49.37 1.03.7 1.62.94l.36 2.54c.04.26.25.42.5.42h3.84c.25 0 .46-.16.5-.42l.36-2.54c.59-.24 1.13-.57 1.62-.94l2.39.96c.19.1.47.02.61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2Z' },
]
const MODS = [
  ['vision', '视觉常驻'],
  ['audio-watch', '听觉常驻'],
  ['voice-out', '语音输出'],
  ['voice-in', '语音输入'],
  ['local-route', '本地分流'],
]
document.addEventListener('contextmenu', (e) => e.preventDefault())

const state = {
  current: 'multi',
  // vision 是合并后的按钮，实际写进 mods.json 的仍是 desktop + video 两个键
  mods: { ...Object.fromEntries(MODS.map(([id]) => [id, false])), 'desk-watch': false, 'video-watch': false },
  persona: '',
  talk: 0,
  sliders: { warmth: 0, tolerance: 0, optimism: 0 },
  h: 0, s: 15, l: 55,
  selectedDay: new Date().getDate(),
  schedColor: 'red',
  volume: 60,
  volMuted: false,
  checking: false,
  checkFail: false,
  classifier: false,
}
try {
  const saved = JSON.parse(localStorage.getItem('hcem-ui-state') || 'null')
  if (saved) {
    Object.assign(state, saved)
    // 旧存档没有 vision 键：用 desk-watch / video-watch 兜底迁移
    if (!state.mods) state.mods = {}
    if (state.mods.vision === undefined) {
      state.mods.vision = Boolean(state.mods['desk-watch'] || state.mods['video-watch'])
    }
    state.mods['desk-watch'] = Boolean(state.mods.vision)
    state.mods['video-watch'] = Boolean(state.mods.vision)
    // 运行时状态不能从存档恢复：checking 一旦被存成 true，
    // 检测按钮会在 onclick 第一行就 return（表现就是"点了没反应"）。实测踩过。
    state.checking = false
    state.checkFail = false
  }
} catch {}

/* ---------- 性格 / 搭话度 → 影响 HSL 系统的基准值 ----------
 * HSL 系统本身有一组默认基准（HSL_SYSTEM_BASE）。
 * 三个性格轴 + 搭话度只改变这个基准的偏移：
 *   - 用户可把三轴拖到 ±5
 *   - AI 随成长可把它写到 ±15（外部 set_sliders 写入，不受滑块范围限制）
 */
const HSL_SYSTEM_BASE = { h: 0, s: 15, l: 55 } // 逻辑色相 0 = 黄（快乐）

function clampNum(v, lo, hi) { return Math.max(lo, Math.min(hi, v)) }

  /**
   * 色彩平衡（与插件侧 emotion.mjs 的 colorBalance 同一算法）
   * 三轴互补色：温和度 红↔青 / 包容度 绿↔洋红 / 乐观度 黄↔蓝
   * 二次衰减权重：距目标色越近推得越用力，单轴最大 ±12°
   */
  function colorBalanceJs(baseHue, sliders, maxDeg = 12) {
    const axes = [
      { value: Number(sliders.warmth || 0), pos: 300, neg: 120 },
      { value: Number(sliders.tolerance || 0), pos: 60, neg: 240 },
      { value: Number(sliders.optimism || 0), pos: 0, neg: 180 },
    ]
    const norm = (x) => ((x % 360) + 360) % 360
    const circ = (a, b) => {
      const d = Math.abs(norm(a) - norm(b))
      return Math.min(d, 360 - d)
    }
    let h = norm(baseHue)
    for (const ax of axes) {
      const v = Math.max(-5, Math.min(5, ax.value)) / 5
      if (v === 0) continue
      const target = v > 0 ? ax.pos : ax.neg
      const dist = circ(h, target)
      const weight = Math.pow(1 - dist / 180, 2)
      if (weight <= 0) continue
      const dir = ((target - h + 540) % 360) - 180
      if (dir === 0) continue
      const move = Math.sign(dir) * Math.min(Math.abs(dir), Math.abs(v) * maxDeg * weight)
      h = norm(h + move)
    }
    return h
  }

  function computeHSLBase() {
    const w = Number(state.sliders.warmth || 0)
    const t = Number(state.sliders.tolerance || 0)
    const o = Number(state.sliders.optimism || 0)
    const talk = Number(state.talk || 0)
    // 话痨 / 好奇 / 安静 → 饱和度与明度偏移
    const talkAdj = [[8, 3], [3, 1], [-6, -3]][talk] || [0, 0]

    // 色相：走色彩平衡（不是简单的「乐观度 × 2」）
    const h = colorBalanceJs(HSL_SYSTEM_BASE.h, { warmth: w, tolerance: t, optimism: o }, 12)
    const s = clampNum(HSL_SYSTEM_BASE.s + w * 0.45 - t * 0.15 + talkAdj[0] * 0.6, 3, 100)
    const l = clampNum(HSL_SYSTEM_BASE.l + w * 0.15 + t * 0.08 + o * 0.12 + talkAdj[1] * 0.5, 10, 90)
    return { h, s, l }
  }

/** 把这个偏移后的基准交给 HSL 系统，并让悬浮球按它上色 */
function applyBaseToHSL() {
  const b = computeHSLBase()
  state.h = b.h
  state.s = b.s
  state.l = b.l
  if (state.current === 'hsl') drawHSL()
  // ① 推给插件：这就是 HSL 系统的基准
  tauriInvoke('set_hsl', { h: b.h, s: b.s, l: b.l, base: true }).catch(() => {})
  // ② 悬浮球按当前值上色
}

function persist() {
  try {
    // 只存用户设置，不存运行时状态（checking 之类的临时标记会把按钮卡死）
    const { checking, checkFail, ...rest } = state

/**
 * 显存让位后，插件把「被踢掉的开关」推过来（Rust eval 调用这里），
 * 按钮要跟着关掉，否则会出现「按钮显示运行中、模型其实已经停了」。
 */
window.applyMods = function (mods) {
  if (!mods || typeof mods !== 'object') return
  const read = (id) => {
    const v = mods[id]
    if (v && typeof v === 'object' && typeof v.enabled === 'boolean') return v.enabled
    return typeof v === 'boolean' ? v : undefined
  }
  // 桌面 + 视频 → vision（菜单里视觉是一个按钮）
  const deskOn = read('desktop')
  const videoOn = read('video')
  if (deskOn !== undefined || videoOn !== undefined) {
    const on = Boolean(deskOn) || Boolean(videoOn)
    state.mods.vision = on
    state.mods['desk-watch'] = on
    state.mods['video-watch'] = on
  }
  for (const id of ['audio', 'voiceIn', 'voiceOut', 'localRoute']) {
    const v = read(id)
    if (v !== undefined) state.mods[id] = v
  }
  persist()
  document.querySelectorAll('.mod-row [data-mod]').forEach((btn) => {
    const mid = btn.dataset.mod
    const on = Boolean(state.mods[mid])
    btn.classList.toggle('is-active', on)
    btn.setAttribute('aria-pressed', on ? 'true' : 'false')
    const label = btn.querySelector('div > div > div')
    if (label) label.textContent = on ? '运行中' : '启动'
  })
}

function pageSchedule() {
  const now = new Date()
  const y = now.getFullYear(), m = now.getMonth()
  const first = new Date(y, m, 1)
  const startDow = (first.getDay() + 6) % 7
  const days = new Date(y, m + 1, 0).getDate()
  const prevDays = new Date(y, m, 0).getDate()
  // 数据存储需求（接系统控制时实现）：
  //   schedule: [{ date:'YYYY-MM-DD', summary:'概括', full:'全文', color:'red|orange|blue|green|purple' }]
  //   存储位置：data/schedule.json（或 SQLite data/schedule.db）
  const schedule = window.__schedule || (window.__schedule = [])
  let cells = ''
  for (let i = startDow - 1; i >= 0; i--) cells += `<div class="cal-cell dim">${prevDays - i}</div>`
  for (let d = 1; d <= days; d++) {
    const dateStr = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`
    const item = schedule.find((s) => s.date === dateStr)
    const today = d === now.getDate() ? 'today' : ''
    const isSel = d === state.selectedDay ? 'selected' : ''
    const mark = item
      ? `<span class="cal-mark" style="background:${item.color}"></span><span class="cal-summary">${item.summary.slice(0, 4)}</span>`
      : ''
    cells += `<div class="cal-cell ${today} ${isSel}" data-day="${d}">${d}${mark}</div>`
  }
  const selDate = `${y}-${String(m + 1).padStart(2, '0')}-${String(state.selectedDay).padStart(2, '0')}`
  const selItem = schedule.find((s) => s.date === selDate)
  const colors = [
    ['red', '#ef4444'], ['orange', '#f97316'], ['blue', '#3b82f6'],
    ['green', '#22c55e'], ['purple', '#a855f7'],
  ]
  return `
    <div class="panel">
      <div class="cal-head">
        <div class="m">${y} 年 ${m + 1} 月</div>
        <div class="cal-nav"><button>‹</button><button>›</button></div>
      </div>
      <div class="cal-week"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
      <div class="cal-grid">${cells}</div>

      <div class="sched-editor">
        <div class="sched-head">${m + 1} 月 ${state.selectedDay} 日 · 日程</div>
        <input class="sched-input" id="sched-summary" placeholder="概括（一句话）" value="${selItem ? selItem.summary : ''}">
        <textarea class="sched-full" id="sched-full" placeholder="全文（详细内容）">${selItem ? selItem.full : ''}</textarea>
        <div class="sched-colors">
          <span class="sched-label">颜色标记</span>
          ${colors.map(([n, c]) => `<button class="sched-color ${state.schedColor === n ? 'on' : ''}" data-color="${n}" style="--cc:${c}"></button>`).join('')}
        </div>
        <div class="sched-actions">
          <button class="plain-btn" id="sched-add">添加</button>
        </div>
      </div>
    </div>`
}

function applyDraft() {

  persist()
  tauriInvoke('ui_cmd', { cmd: 'set_sliders', data: Object.assign({}, state.sliders) }).catch(() => {})

/* ---------- 绑定 ---------- */
function bindPage() {
  const id = state.current

  // 日历：点日选中、颜色、添加
  document.querySelectorAll('.cal-cell[data-day]').forEach((cell) => {
    cell.onclick = () => {
      state.selectedDay = Number(cell.dataset.day)
      persist()
      renderPages()
      bindPage()
    }
  })
  document.querySelectorAll('.sched-color').forEach((b) => {
    b.onclick = () => {
      state.schedColor = b.dataset.color
      persist()
      renderPages()
      bindPage()
    }
  })
  const addBtn = $('sched-add')
  if (addBtn) {
    addBtn.onclick = () => {
      const now = new Date()
      const y = now.getFullYear(), m = now.getMonth()
      const dateStr = y + '-' + String(m + 1).padStart(2, '0') + '-' + String(state.selectedDay).padStart(2, '0')
      const summary = ($('sched-summary').value || '').trim()
      const full = ($('sched-full').value || '').trim()
      if (!summary && !full) return
      const arr = window.__schedule || (window.__schedule = [])
      const idx = arr.findIndex((s) => s.date === dateStr)
      const item = { date: dateStr, summary: summary || full.slice(0, 8), full, color: state.schedColor }
      if (idx >= 0) arr[idx] = item
      else arr.push(item)
      tauriInvoke('ui_cmd', { cmd: 'add_schedule', data: item }).catch(() => {})
      renderPages()
      bindPage()
    }
  }

  // 角色卡 / 用户卡：直读插件用的同一份文件，避免菜单和 AI 看到的内容不一致
  tauriInvoke('read_persona')
    .then((txt) => {
      if (typeof txt === 'string' && txt.length >= 0) {
        state.persona = txt
        const ta = $('persona-text')
        if (ta && document.activeElement !== ta) ta.value = txt
      }
    })
    .catch(() => {})
  tauriInvoke('read_user_card')
    .then((txt) => {
      if (typeof txt === 'string') {
        const ta = $('user-card-text')
        if (ta && document.activeElement !== ta) ta.value = txt
      }
    })
    .catch(() => {})

  // 设置：工具分类头（默认关）
  const clsSw = $('classifier-enabled')
  if (clsSw) {
    clsSw.checked = !!state.classifier
    clsSw.onchange = () => {
      state.classifier = clsSw.checked
      persist()
      tauriInvoke('ui_cmd', { cmd: 'set_classifier', data: { enabled: state.classifier } }).catch(() => {})
    }
  }

  // 设置：插件总开关
  const pluginSw = $('plugin-enabled')
  if (pluginSw) {
    tauriInvoke('get_enabled')
      .then((on) => { pluginSw.checked = on === true })
      .catch(() => {})
    pluginSw.onchange = async () => {
      const on = pluginSw.checked
      try {
        await tauriInvoke('set_enabled', { enabled: on })
      } catch (e) {
        pluginSw.checked = !on
      }
    }
  }

  // 设置：DSH 后台不搭话（气泡的聚焦门）
  const bubbleFocus = $('bubble-focus')
  if (bubbleFocus) {
    fetch(BUBBLE_ROUTE, { method: 'POST', headers: { 'content-type': 'application/json' }, body: '{}' })
      .then((r) => (r.ok ? r.json() : null))
      .then((r) => {
        if (r && r.ok) bubbleFocus.checked = r.requireFocus !== false
      })
      .catch(() => {})
    bubbleFocus.onchange = async () => {
      const want = bubbleFocus.checked
      try {
        const res = await fetch(BUBBLE_ROUTE, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ requireFocus: want }),
        })
        if (!res.ok) bubbleFocus.checked = !want
      } catch (e) {
        bubbleFocus.checked = !want
      }
    }
  }

  // 设置：打开数据目录
  const openDir = $('open-dir-slot')
  if (openDir) {
    openDir.onclick = () => { tauriInvoke('open_data_dir').catch(() => {}) }
  }

  // 设置：悬浮球大小
  const orbScale = $('orb-scale')
  if (orbScale) {
    orbScale.oninput = () => {
      state.orbScale = Number(orbScale.value)
      persist()
      tauriInvoke('set_orb_scale', { scale: state.orbScale }).catch(() => {})
    }
    tauriInvoke('set_orb_scale', { scale: state.orbScale ?? 1 }).catch(() => {})
  }

  // 音量：拖动 + 喇叭静音切换（音量.txt 原版逻辑）
  const volBtn = $('vol-btn')
  const volLevel = $('vol-level')
  const volWrap = $('vol-wrap')
  const volVal = $('vol-value')
  if (volBtn && volLevel) {
    const paint = () => {
      const v = Number(volLevel.value)
      state.volume = v
      if (v === 0) {
        state.volMuted = true
        volWrap.classList.add('is-muted')
      } else {
        state.volMuted = false
        volWrap.classList.remove('is-muted')
        state.lastVolume = v
      }
      if (volVal) volVal.textContent = v
      persist()
      tauriInvoke('ui_cmd', { cmd: 'set_volume', data: { volume: v } }).catch(() => {})
    }
    volLevel.oninput = paint
    volBtn.onclick = () => {
      const cur = Number(volLevel.value)
      volLevel.value = cur === 0 ? (state.lastVolume || 60) : 0
      paint()
    }
    paint()
  }

  /** 点「保存」后：把草稿写回 state，推给插件，并让 HSL 基准生效 */


  // 所有保存按钮：点击后蓝点扩散 + 变绿
  document.querySelectorAll('.save-btn').forEach((btn) => {
    btn.onclick = () => {
      // 角色卡页：保存时把草稿生效并同步给插件
      if (btn.closest('#save-persona-slot')) applyDraft()
      if (btn.classList.contains('saved')) return
      const textEl = btn.querySelector('span:nth-child(6)')
      const old = textEl.textContent
      btn.classList.add('saved')
      textEl.textContent = '已保存'
      setTimeout(() => {
        btn.classList.remove('saved')
        textEl.textContent = old
      }, 1500)
    }
  })

  if (id === 'persona') {
    const ta = $('persona-text')
    const count = $('persona-count')
    const update = () => {
      state.persona = ta.value
      count.textContent = String(ta.value.length).padStart(3, '0') + ' 字'
      persist()
    }
    ta.oninput = update
    update()

    const container = $('sliders')
    container.innerHTML = sliderRows()
    container.querySelectorAll('.slider-group').forEach((group) => {
      const k = group.dataset.k
      const input = group.querySelector('input')
      const ticks = group.querySelector('.ticks')
      const out = group.querySelector('.slider-val')
      const reversed = k === 'tolerance'
      for (let i = 0; i <= 30; i++) {
        const t = document.createElement('span')
        t.className = 'tick' + (i % 5 === 0 ? ' major' : '')
        t.style.left = (i / 30 * 100) + '%'
        ticks.appendChild(t)
      }
      const paint = () => {
        // 条是完整的 -15..15，但用户手动只能拖到 ±5；
        // AI 成长时由外部写入更大值（直接改 state，不经这里）。
        const USER_MAX = 5
        let v = Number(input.value)
        if (Math.abs(v) > USER_MAX) {
          v = v > 0 ? USER_MAX : -USER_MAX
          input.value = v
        }
        let hue
        if (reversed) hue = v <= 0 ? ((v + 15) / 15) * 150 : 150 + (v / 15) * 50
        else hue = v <= 0 ? 200 - ((v + 15) / 15) * 50 : 150 - (v / 15) * 150
        group.style.setProperty('--c', `hsl(${hue} 100% 55%)`)
        out.textContent = v > 0 ? '+' + v : String(v)
        // 只改草稿：点「保存」后才真正生效
        state.draftSliders = state.draftSliders || {}
        state.draftSliders[k] = v
      }
      input.oninput = paint
      paint()
    })

    document.querySelectorAll('input[name=tone]').forEach((r) => {
      r.onchange = () => {
        // 搭话度也只改草稿
        state.draftTalk = ['tone-1', 'tone-2', 'tone-3'].indexOf(r.id)
      }
    })
  }

  if (id === 'import') {
    const drop = $('drop')
    const list = $('file-list')
    const files = []
    const render = () => {
      list.innerHTML = files.map((f, i) => `
        <div class="file-item">
          <span class="ico">${(f.name.split('.').pop() || '?').toUpperCase().slice(0, 3)}</span>
          <span>${f.name}</span>
          <span class="meta">${(f.size / 1024).toFixed(1)} KB</span>
          <button class="rm" data-i="${i}">×</button>
        </div>`).join('')
      list.querySelectorAll('.rm').forEach((b) => (b.onclick = () => { files.splice(+b.dataset.i, 1); render() }))
    }
    drop.onclick = () => {
      const input = document.createElement('input')
      input.type = 'file'
      input.multiple = true
      input.onchange = () => {
        for (const f of input.files) files.push(f)
        render()
      }
      input.click()
    }
    drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('over') }
    drop.ondragleave = () => drop.classList.remove('over')
    drop.ondrop = (e) => {
      e.preventDefault()
      drop.classList.remove('over')
      for (const f of e.dataTransfer.files) files.push(f)
      render()
    }
  }

  if (id === 'hsl') drawHSL()

  if (id === 'multi') {
    const panel = document.querySelector('.multi-panel')
    if (panel) {
      const WIRE_COLORS = ['#a855f7', '#06b6d4', '#eab308', '#f97316', '#3b82f6', '#ef4444', '#22c55e']

      const syncFlows = () => {
        panel.querySelectorAll('.mod-row').forEach((row) => {
          const btn = row.querySelector('[data-mod]')
          if (!btn) return
          const flow = row.__flow
          if (!flow) return
          flow.style.display = state.mods[btn.dataset.mod] ? '' : 'none'
        })
      }

      const buildWires = () => {
        const svg = $('wire-svg')
        const anchor = $('check-btn')
        if (!svg || !anchor) return
        const pr = panel.getBoundingClientRect()
        const br = anchor.getBoundingClientRect()
        if (!pr.width || !br.width) return
        svg.setAttribute('viewBox', `0 0 ${Math.round(pr.width)} ${Math.round(pr.height)}`)
        svg.setAttribute('preserveAspectRatio', 'none')
        const tx = br.left - pr.left - 6
        const ty = br.top - pr.top + br.height / 2
        const rows = [...panel.querySelectorAll('.mod-row'), panel.querySelector('.check-row')].filter(Boolean)
        svg.innerHTML = ''
        rows.forEach((row, i) => {
          const nameEl = row.querySelector('.name')
          if (!nameEl) return
          const vol = row.querySelector('.vol-row')
          let sr
          if (vol) {
            sr = vol.getBoundingClientRect()
          } else {
            const range = document.createRange()
            range.selectNodeContents(nameEl)
            sr = range.getBoundingClientRect()
          }
          const sx = Math.min(sr.right - pr.left + 12, tx - 14)
          const sy = sr.top - pr.top + sr.height / 2
          const isCheckRow = row.classList.contains('check-row')
          // 通道从右往左排（越靠上的行通道越靠右），这样竖向段不会与下方行的横线交叉
          const chX = isCheckRow ? tx - 150 : tx - 18 - i * 16
          // 汇入按钮的横线错开高度（都落在按钮中线上方，避免与检测行横线重叠）
          const finY = isCheckRow ? ty : ty - 32 + i * 3
          const d = isCheckRow
            ? `M ${sx.toFixed(1)} ${sy.toFixed(1)} L ${sx.toFixed(1)} ${ty.toFixed(1)} L ${tx.toFixed(1)} ${ty.toFixed(1)}`
            : `M ${sx.toFixed(1)} ${sy.toFixed(1)} L ${chX.toFixed(1)} ${sy.toFixed(1)} L ${chX.toFixed(1)} ${finY.toFixed(1)} L ${tx.toFixed(1)} ${finY.toFixed(1)}`
          const color = WIRE_COLORS[i % WIRE_COLORS.length]
          const g = document.createElementNS('http://www.w3.org/2000/svg', 'g')
          let inner = `<path class="wire-bg" d="${d}" /><circle class="wire-dot" cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="5" />`
          if (!isCheckRow) {
            inner += `<path class="wire-flow" d="${d}" stroke="${color}" style="display:none" />`
          }
          g.innerHTML = inner
          svg.appendChild(g)
          const flow = g.querySelector('.wire-flow')
          if (flow) {
            const len = flow.getTotalLength()
            const dash = Math.max(26, Math.min(54, len * 0.05))
            flow.style.strokeDasharray = `${dash} ${Math.max(1, len - dash)}`
            row.__flow = flow
            const anim = document.createElementNS('http://www.w3.org/2000/svg', 'animate')
            anim.setAttribute('attributeName', 'stroke-dashoffset')
            anim.setAttribute('from', String(len))
            anim.setAttribute('to', '0')
            anim.setAttribute('dur', `${Math.max(1.6, len / 140).toFixed(2)}s`)
            anim.setAttribute('repeatCount', 'indefinite')
            flow.appendChild(anim)
          }
        })
        syncFlows()
      }

      buildWires()
      requestAnimationFrame(buildWires)
      window.addEventListener('resize', buildWires, { once: true })

      document.querySelectorAll('.mod-row [data-mod]').forEach((btn) => {
        btn.onclick = () => {
          const mid = btn.dataset.mod
          state.mods[mid] = !state.mods[mid]
          // 「视觉常驻」同时驱动桌面监视 + 视频监视（后端仍按这两个键判断）
          if (mid === 'vision') {
            state.mods['desk-watch'] = state.mods.vision
            state.mods['video-watch'] = state.mods.vision
          }
          btn.classList.toggle('is-active', state.mods[mid])
          btn.setAttribute('aria-pressed', state.mods[mid] ? 'true' : 'false')
          btn.querySelector('div > div > div').textContent = state.mods[mid] ? '运行中' : '启动'
          persist()
          syncFlows()
          // 开关状态同步给插件（命名管道 CMD set_mods）
          tauriInvoke('set_mods', { mods: state.mods }).catch(() => {})
        }
      })

      const checkBtn = panel.querySelector('[data-mod="check"]')
      if (checkBtn) {
        checkBtn.onclick = async () => {
          try { tauriInvoke('dbg_click', { what: 'check-click' }).catch(() => {}) } catch {}
          if (state.checking) return
          state.checking = true
          checkBtn.classList.add('is-active')
          checkBtn.querySelector('div > div > div').textContent = '检测中'
          // 检测只报告状态，不启动模型（模型由「本地分流」开关控制）
          let items = []
          try {
            items = await tauriInvoke('check_services')
          } catch (e) {
            items = [{ name: '检测调用失败', state: 'off', detail: String(e) }]
          }
          if (!Array.isArray(items) || !items.length) items = [{ name: '无检测结果', state: 'off', detail: '' }]
          state.checking = false
          checkBtn.classList.remove('is-active')
          checkBtn.querySelector('div > div > div').textContent = '检测'
          // 只有「不可用」才算异常；「就绪但开关没开」是正常状态
          const allOk = items.every((i) => i.state !== 'off')
          showCheckCard(items, allOk)
        }
      }
    }
  }

  /* ---------- 记忆导入：拖放 → 复制到 reincarnation ---------- */
  if (id === 'import') {
    const stage = $('imp-stage')
    const bar = $('imp-bar')
    const text = $('imp-text')
    const list = $('file-list')
    const run = async (paths) => {
      if (!paths || !paths.length || !stage) return
      stage.classList.add('show')
      if (bar) bar.style.width = '12%'
      if (text) text.textContent = '正在复制并预打戳…'
      let res = []
      try { res = await tauriInvoke('import_memory', { paths }) } catch (e) { res = [] }
      let p = 12
      const timer = setInterval(() => {
        p = Math.min(90, p + 8)
        if (bar) bar.style.width = p + '%'
      }, 130)
      setTimeout(() => {
        clearInterval(timer)
        if (bar) bar.style.width = '100%'
        const okCount = res.filter((r) => r.ok).length
        if (text) text.textContent = okCount ? ('已导入 ' + okCount + ' 个文件，开始预打戳') : '导入失败'
        if (list && res.length) {
          list.innerHTML = res.map((r) => '<div class="file-item">' + (r.ok ? '✓' : '✗') + ' ' + r.name + ' <span class="dt">' + (r.ok ? (Math.round(r.size / 1024) + ' KB') : r.detail) + '</span></div>').join('')
        }
        setTimeout(() => stage.classList.remove('show'), 1500)
      }, 900)
    }
    window.__hcemImport = run
    if (window.__TAURI__ && window.__TAURI__.event && !window.__hcemDropBound) {
      window.__hcemDropBound = true
      window.__TAURI__.event.listen('tauri://drag-drop', (e) => {
        const paths = (e && e.payload && e.payload.paths) || []
        if (window.__hcemImport) window.__hcemImport(paths)
      })
    }
    const drop = $('drop')
    if (drop) {
      drop.onclick = () => {
        if (text) text.textContent = '把文件拖进窗口即可'
        if (stage) stage.classList.add('show')
      }
    }
  }

/* ---------- HSL 绘制 ---------- */
function hslToRgb(h, s, l) {
  s /= 100; l /= 100
  const c = (1 - Math.abs(2 * l - 1)) * s
  const x = c * (1 - Math.abs(((h / 60) % 2) - 1))
  const m = l - c / 2
  let r = 0, g = 0, b = 0
  if (h < 60) [r, g, b] = [c, x, 0]
  else if (h < 120) [r, g, b] = [x, c, 0]
  else if (h < 180) [r, g, b] = [0, c, x]
  else if (h < 240) [r, g, b] = [0, x, c]
  else if (h < 300) [r, g, b] = [x, 0, c]
  else [r, g, b] = [c, 0, x]
  return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)]
}
const EMOTIONS = [[0, '快乐'], [60, '惊讶'], [120, '恐惧'], [180, '悲伤'], [240, '厌恶'], [300, '愤怒']]
function nearestName(H) {
  let best = EMOTIONS[0], bestD = 999
  for (const e of EMOTIONS) {
    const d = Math.min(Math.abs(H - e[0]), 360 - Math.abs(H - e[0]))
    if (d < bestD) { bestD = d; best = e }
  }
  return best[1]
}
function drawHSL() {
  const canvas = $('hsl-plane')
  if (!canvas) return
  const ctx = canvas.getContext('2d')
  const w = canvas.width, h = canvas.height
  const img = ctx.createImageData(w, h)
  for (let y = 0; y < h; y++) {
    const L = (1 - y / (h - 1)) * 100
    for (let x = 0; x < w; x++) {
      const S = (x / (w - 1)) * 100
      // HCEM 色相定义：H=0° 是黄（不是标准 HSL 的红），整体偏移 60°
      const [r, g, b] = hslToRgb((state.h + 60) % 360, S, L)
      const i = (y * w + x) * 4
      img.data[i] = r; img.data[i + 1] = g; img.data[i + 2] = b; img.data[i + 3] = 255
    }
  }
  ctx.putImageData(img, 0, 0)
  const p = $('hsl-pointer')
  if (p) p.style.transform = `rotate(${state.h}deg)`
  // H 跟色环走（色环上的纯色相，S=100 L=55）
  const hueColor = `hsl(${(state.h + 60) % 360} 100% 55%)`
  // S 跟方框走（方框里的绿：色相固定，按 S 变化）
  const sColor = `hsl(${(state.h + 60) % 360} ${Math.max(20, state.s)}% 50%)`
  // L 跟黑白明度走（纯灰阶）
  const lColor = `hsl(0 0% ${Math.round(state.l)}%)`
  const big = $('hsl-big'); if (big) { big.textContent = `H ${Math.round(state.h)}°`; big.style.color = hueColor }
  const nm = $('hsl-name'); if (nm) nm.textContent = nearestName(state.h)
  const sEl = $('hsl-s'); if (sEl) sEl.textContent = Math.round(state.s) + '%'
  const lEl = $('hsl-l'); if (lEl) lEl.textContent = Math.round(state.l) + '%'
  const sBar = $('hsl-s-bar'); if (sBar) { sBar.style.width = state.s + '%'; sBar.style.background = sColor }
  const lBar = $('hsl-l-bar'); if (lBar) { lBar.style.width = state.l + '%'; lBar.style.background = lColor }
  // 把 HSL 推给悬浮球（颜色一致）
  if (typeof suppressHslPush === 'undefined' || !suppressHslPush) {
    tauriInvoke('set_hsl', { h: state.h, s: state.s, l: state.l }).catch(() => {})
  }
  // 方框里的点（S 横向、L 纵向；限制在 0-100）
  const dot = $('hsl-dot')
  if (dot) {
    const sx = Math.max(0, Math.min(100, state.s))
    const ly = Math.max(0, Math.min(100, state.l))
    dot.style.left = (65 + (sx / 100) * 170) + 'px'
    dot.style.top = (65 + ((100 - ly) / 100) * 170) + 'px'
    dot.style.background = hueColor
  }
}

function applyState(s) {
  if (!s) return
  // 兼容两种字段名：本地状态用大写 H/S/L，桥接帧（pipe-server → Rust）用小写 h/s/l。
  // 以前只认大写，于是 STATE 推过来的值全被丢掉——这就是"HSL 读数不跟系统动"的另一半。
  const H = typeof s.H === 'number' ? s.H : typeof s.h === 'number' ? s.h : null
  const S = typeof s.S === 'number' ? s.S : typeof s.s === 'number' ? s.s : null
  const L = typeof s.L === 'number' ? s.L : typeof s.l === 'number' ? s.l : null
  if (H !== null) state.h = H
  if (S !== null) state.s = S
  if (L !== null) state.l = L
  if (state.current === 'hsl') drawHSL()
}

async function syncTalkFromPlugin() {

      const mr = await fetch('http://127.0.0.1:8097/mods', {

        body: '{}',
      })
      if (mr.ok) {
        const mj = await mr.json()
        if (mj?.mods) window.applyMods?.(mj.mods)
      }
    } catch {}
    const res = await fetch(BUBBLE_ROUTE, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: '{}',
    })
    if (!res.ok) return
    const r = await res.json()
    const t = Number(r?.talk)
    if (!Number.isFinite(t)) return
    if (t === Number(state.talk)) return
    if (Number(state.draftTalk) !== Number(state.talk)) return
    state.talk = t
    state.draftTalk = t
    persist()
    const el = $(['tone-1', 'tone-2', 'tone-3'][t])
    if (el) el.checked = true
    if (state.current === 'hsl') applyBaseToHSL()
  } catch (e) {}
}
setInterval(syncTalkFromPlugin, 3000)
syncTalkFromPlugin()

window.addEventListener('message', (e) => {
  const d = e.data
  if (!d) return
  if (d.type === 'hcem:state') applyState(d.state)
  if (d.type === 'hcem:goto') switchPage(d.page)
})
// 供 Rust 侧 eval 调用（右键菜单跳页）
window.gotoPage = (page) => { if (page && PAGES[page]) switchPage(page) }
// 页面加载后取一次待跳转页（右键菜单指定页）
setTimeout(() => {
  tauriInvoke('take_pending_page').then((p) => { if (p) window.gotoPage(p) }).catch(() => {})
}, 80)
</script>
