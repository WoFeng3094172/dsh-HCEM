[package]
name = "app"
version = "0.1.0"
description = "HCEM Desktop"
authors = ["HCEM"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"
default-run = "app"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.6", features = ["image-png", "image-ico"] }
tauri-plugin-log = "2"

[target.'cfg(windows)'.dependencies]
tokio = { version = "1.54", features = ["net", "io-util", "time", "sync", "rt"] }
